---
- name: Template and Handler Demo
  hosts: localhost
  connection: local
  become: yes

  vars:
    server_name: "Ansible-EC2"
    server_port: 8080
    server_environment: "Production"

  tasks:

    - name: Install Apache
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Deploy Apache configuration
      ansible.builtin.template:
        src: server.conf.j2
        dest: /etc/apache2/conf-available/server.conf
      notify: Restart Apache

  handlers:

    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted
